[package]
name = "excel_cli"
version = "0.1.2"
edition = "2021"
authors = ["Jin"]
description = "面向 Agent 的原生高性能单文件 Excel CLI 工具"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
calamine = "0.26"
umya-spreadsheet = "2.2"
csv = "1.3"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
regex = "1.10"
[workspace]