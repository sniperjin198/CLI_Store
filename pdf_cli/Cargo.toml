[package]
name = "pdf_cli"
version = "0.1.0"
edition = "2021"

[dependencies]
lopdf = "0.31.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
image = "0.24"
imageproc = "0.23"
rusttype = "0.9"
flate2 = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Foundation",
    "Foundation_Collections",
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Graphics_Imaging",
    "System",
    "Win32_System_WinRT",
] }